<!DOCTYPE html>
<html>
<head>
    <title>Rowspan and Colspan Example</title>
</head>
<body>

    <h2>Student Marks Report</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <th colspan="3">Student Details & Marks</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td rowspan="2">Hardik</td>
            <td>Python</td>
            <td>95</td>
        </tr>

        <tr>
            <td>Data Science</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Prince</td>
            <td>Web Design</td>
            <td>85</td>
        </tr>
    </table>

</body>
</html>
